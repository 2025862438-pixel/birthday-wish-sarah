<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Selamat Hari Lahir!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#2B1B5A; --bg2:#4B2A8C; --pink:#FF6FA5; --yellow:#FFD84D;
  --mint:#5CE0C0; --paper:#FFF8F0; --ink:#2B1B5A;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  color:var(--paper);
  background:radial-gradient(circle at 50% 20%,var(--bg2),var(--bg) 70%);
  overflow:hidden;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
}
.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  padding:24px;gap:18px;
  opacity:0;pointer-events:none;transition:opacity .6s;
}
.screen.on{opacity:1;pointer-events:auto}
h1{font-size:clamp(2rem,9vw,3.4rem);font-weight:700;line-height:1.1}
.small{font-size:1.1rem;opacity:.85}
.name{color:var(--yellow)}
button{
  font:inherit;font-weight:600;font-size:1.15rem;cursor:pointer;
  background:var(--yellow);color:var(--ink);border:0;border-radius:999px;
  padding:14px 30px;box-shadow:0 5px 0 #c9a21c;
}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #c9a21c}
:focus-visible{outline:3px solid var(--mint);outline-offset:3px}

/* Hadiah */
.gift{position:relative;width:150px;height:150px;margin:10px 0;cursor:pointer;
  background:none;box-shadow:none;border-radius:0;padding:0}
.gift .box{position:absolute;bottom:0;left:10px;right:10px;height:95px;background:var(--pink);border-radius:6px}
.gift .box::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:22px;margin-left:-11px;background:var(--yellow)}
.gift .lid{position:absolute;left:0;right:0;bottom:90px;height:38px;background:#ff8cb8;border-radius:6px;
  transition:transform .6s cubic-bezier(.3,1.6,.5,1);transform-origin:left bottom}
.gift .lid::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:22px;margin-left:-11px;background:var(--yellow)}
.gift .lid::before{content:"";position:absolute;left:50%;top:-22px;width:44px;height:26px;margin-left:-22px;
  border:7px solid var(--yellow);border-radius:50% 50% 0 0}
.gift:not(.open){animation:wiggle 1.8s infinite}
.gift.open .lid{transform:translateY(-70px) rotate(-24deg)}
@keyframes wiggle{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-5deg)}84%{transform:rotate(5deg)}92%{transform:rotate(-3deg)}}

/* Kek */
.cake{position:relative;width:220px;height:230px;margin:18px 0 6px;cursor:pointer}
.plate{position:absolute;bottom:0;left:0;right:0;height:14px;background:var(--mint);border-radius:50%}
.tier{position:absolute;left:50%;transform:translateX(-50%);border-radius:14px 14px 6px 6px}
.t2{bottom:8px;width:200px;height:72px;background:var(--yellow)}
.t1{bottom:78px;width:140px;height:58px;background:var(--pink)}
.tier::before{content:"";position:absolute;left:0;right:0;top:0;height:16px;background:var(--paper);
  border-radius:14px 14px 40% 40%/14px 14px 100% 100%}
.candles{position:absolute;bottom:134px;left:50%;width:110px;margin-left:-55px;display:flex;justify-content:space-between}
.candles i{position:relative;display:block;width:10px;height:38px;border-radius:3px;
  background:repeating-linear-gradient(135deg,var(--paper) 0 7px,var(--mint) 7px 14px)}
.flame{position:absolute;left:50%;top:-24px;width:14px;height:22px;margin-left:-7px;
  background:radial-gradient(circle at 50% 70%,#fff3a0,#ffb02e 60%,#ff6a2e);
  border-radius:50% 50% 50% 50%/65% 65% 35% 35%;transform-origin:50% 100%;
  animation:flick .35s infinite alternate;transition:transform .35s,opacity .35s}
.candles i:nth-child(2) .flame{animation-delay:.1s}
.candles i:nth-child(3) .flame{animation-delay:.2s}
.cake.out .flame{transform:scale(0);opacity:0;animation:none}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.88,1.1) rotate(3deg)}}

/* Kad ucapan */
.card{
  background:var(--paper);color:var(--ink);border-radius:26px;
  padding:30px 24px;width:min(92vw,420px);max-height:86vh;overflow:auto;
  box-shadow:0 12px 0 rgba(0,0,0,.18);
}
.card h1{color:var(--pink);font-size:clamp(1.6rem,7vw,2.2rem)}
.card .big{font-size:clamp(2.4rem,12vw,3.6rem);font-weight:700;line-height:1.05;margin:6px 0 14px;overflow-wrap:anywhere}
.card p{font-size:1.1rem;line-height:1.5;max-width:34ch;margin:0 auto 14px}
.card img{display:block;max-width:100%;max-height:220px;margin:0 auto 14px;border-radius:16px}
.from{font-weight:600}
.again{background:var(--pink);color:#fff;box-shadow:0 5px 0 #c24a79;margin-top:6px}
.again:active{box-shadow:0 2px 0 #c24a79}

#snd{position:fixed;top:calc(12px + env(safe-area-inset-top,0));right:12px;z-index:5;
  width:46px;height:46px;padding:0;font-size:1.3rem;display:none}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}

@media (prefers-reduced-motion:reduce){
  .gift:not(.open),.flame{animation:none}
  .screen{transition:none}
}
</style>
</head>
<body>

<button id="snd" aria-label="Bunyi hidup atau mati" aria-pressed="true">🔊</button>

<!-- Skrin 1: hadiah -->
<section class="screen on" id="s1">
  <h1 class="name" id="n1" style="font-size:clamp(1.7rem,8vw,2.6rem)"></h1>
  <button class="gift" id="gift" aria-label="Buka hadiah"><span class="box"></span><span class="lid"></span></button>
  <p class="small">Tekan hadiah tu</p>
</section>

<!-- Skrin 2: kek -->
<section class="screen" id="s2">
  <h1>Buat hajat dulu,<br>lepas tu tiup!</h1>
  <div class="cake" id="cake" role="button" tabindex="0" aria-label="Tiup lilin">
    <div class="candles"><i><b class="flame"></b></i><i><b class="flame"></b></i><i><b class="flame"></b></i></div>
    <div class="tier t1"></div><div class="tier t2"></div><div class="plate"></div>
  </div>
  <button id="blow">Tiup lilin</button>
</section>

<!-- Skrin 3: ucapan -->
<section class="screen" id="s3">
  <div class="card">
    <h1 id="judul">Selamat Hari Lahir,</h1>
    <div class="big name" id="n3" style="color:var(--ink)"></div>
    <img id="foto" alt="" hidden>
    <p id="ucapan"></p>
    <p class="from" id="dari"></p>
    <button class="again" id="again">Main sekali lagi</button>
  </div>
</section>

<canvas id="confetti"></canvas>

<script>
/* ====== UBAH DI SINI ====== */
var NAMA   = "Sarah";                 // nama kawan awak
var UMUR   = 20;                      // umur sempena hari lahir
var DARI   = "Adha";                  // nama awak
var GAMBAR = "";                      // contoh: "gambar1.jpg" (upload sekali dalam repo). Biar kosong kalau tak nak
var UCAPAN = "Happy 20th birthday, Sarah! Cepat molek masa bergerak, dewasa dah. Anyway, Adha doakan semoga Sarah sentiasa buat pilihan yang betul dalam study dan masa depan Sarah. On a side note, Adha nak mintak maaf sangat-sangat atas segala salah silap Adha yang lepas-lepas. Semoga segala cita-cita dan impian Sarah tercapai. Semoga success selalu!";
/* ========================== */

/* Boleh juga tukar guna link: ...index.html?nama=Aiman&dari=Ali */
var q = new URLSearchParams(location.search);
if (q.get("nama")) NAMA = q.get("nama");
if (q.get("dari")) DARI = q.get("dari");

var $ = function(id){return document.getElementById(id)};
$("n1").textContent = "Ni " + DARI + " buat sendiri guna HTML untuk " + NAMA + " HAHAHAHAHAH";
$("n3").textContent = NAMA + "!";
$("ucapan").textContent = UCAPAN;
$("dari").textContent = "Dari " + DARI;
document.title = "Happy Birthday, " + NAMA + "!";
if (UMUR) $("judul").textContent = "Happy " + UMUR + "th Birthday,";
if (GAMBAR) { $("foto").src = GAMBAR; $("foto").hidden = false; }

function show(id){
  ["s1","s2","s3"].forEach(function(s){$(s).classList.toggle("on", s===id)});
}

/* ---- Muzik: lagu hari lahir dibuat dengan Web Audio (tak perlu fail) ---- */
var ctx = null, soundOn = true, timers = [];
var TUNE = [[392,.75],[392,.25],[440,1],[392,1],[523,1],[494,2],
            [392,.75],[392,.25],[440,1],[392,1],[587,1],[523,2],
            [392,.75],[392,.25],[784,1],[659,1],[523,1],[494,1],[440,2],
            [698,.75],[698,.25],[659,1],[523,1],[587,1],[523,2]];
function playTune(){
  if (!soundOn) return;
  try{
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === "suspended") ctx.resume();
    var t = ctx.currentTime + .1, beat = .42;
    TUNE.forEach(function(n){
      var o = ctx.createOscillator(), g = ctx.createGain(), d = n[1]*beat;
      o.type = "triangle"; o.frequency.value = n[0];
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(.25,t+.03);
      g.gain.exponentialRampToValueAtTime(.001,t+d*.95);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t+d); t += d;
    });
  }catch(e){}
}
function stopTune(){
  if (ctx){ try{ ctx.close(); }catch(e){} ctx = null; }
}
$("snd").onclick = function(){
  soundOn = !soundOn;
  this.textContent = soundOn ? "🔊" : "🔇";
  this.setAttribute("aria-pressed", soundOn);
  if (!soundOn) stopTune();
};

/* ---- Confetti ---- */
var cv = $("confetti"), cx = cv.getContext("2d"), bits = [], raf = null;
var COLORS = ["#FF6FA5","#FFD84D","#5CE0C0","#FFF8F0","#8F6BFF"];
function fit(){ cv.width = innerWidth; cv.height = innerHeight; }
fit(); addEventListener("resize", fit);
function burst(n){
  var reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
  if (reduce) n = Math.round(n/5);
  for (var i=0;i<n;i++){
    bits.push({
      x: Math.random()*cv.width, y: -20 - Math.random()*cv.height*.5,
      w: 7+Math.random()*7, h: 10+Math.random()*8,
      vx: -1.5+Math.random()*3, vy: 2+Math.random()*3.5,
      r: Math.random()*6, vr: -.2+Math.random()*.4,
      c: COLORS[(Math.random()*COLORS.length)|0]
    });
  }
  if (!raf) loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  bits.forEach(function(b){
    b.x += b.vx; b.y += b.vy; b.r += b.vr;
    cx.save(); cx.translate(b.x,b.y); cx.rotate(b.r);
    cx.fillStyle = b.c; cx.fillRect(-b.w/2,-b.h/2,b.w,b.h); cx.restore();
  });
  bits = bits.filter(function(b){return b.y < cv.height+30});
  raf = bits.length ? requestAnimationFrame(loop) : (cx.clearRect(0,0,cv.width,cv.height), null);
}

/* ---- Aliran ---- */
$("gift").onclick = function(){
  this.classList.add("open");
  playTune();
  setTimeout(function(){ show("s2"); }, 900);
};
var blown = false;
function blow(){
  if (blown) return; blown = true;
  $("cake").classList.add("out");
  setTimeout(function(){ burst(160); show("s3"); }, 700);
  setTimeout(function(){ burst(120); }, 2200);
}
$("blow").onclick = blow;
$("cake").onclick = blow;
$("cake").onkeydown = function(e){ if (e.key==="Enter"||e.key===" ") { e.preventDefault(); blow(); } };
$("again").onclick = function(){
  blown = false;
  $("cake").classList.remove("out");
  $("gift").classList.remove("open");
  stopTune();
  show("s1");
};
$("snd").style.display = "block";
</script>
</body>
</html>
